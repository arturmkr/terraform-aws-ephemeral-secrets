name: Infra Bootstrap
run-name: Create state backend · ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment backend to create
        required: true
        type: choice
        options:
          - dev
          - stage

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.4"

concurrency:
  group: terraform-bootstrap-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create ${{ inputs.target }} state backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_STATE_REGION }}
          mask-aws-account-id: true

      - name: Create backend bucket
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap apply -auto-approve -input=false \
            -var="aws_region=${TF_STATE_REGION}" \
            -var="state_bucket_name=${TF_STATE_BUCKET}"

      - name: Store bootstrap state in the new bucket
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > bootstrap/backend_override.tf
          terraform -chdir=bootstrap init -input=false -migrate-state -force-copy \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
