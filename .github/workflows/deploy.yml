name: Infra Deploy
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Manual {0} · {1}', inputs.action, inputs.target) || 'Deploy changed environments' }}

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      target:
        description: Environment to manage
        required: true
        default: all
        type: choice
        options:
          - all
          - dev
          - stage

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.4"
  TF_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}

jobs:
  changes:
    name: Detect environments to deploy
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ github.event_name == 'push' && steps.filter.outputs.changes || (inputs.target == 'all' && '["dev","stage"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Detect changed environments
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            dev:
              - "environments/dev/**"
              - "modules/**"
            stage:
              - "environments/stage/**"
              - "modules/**"

  terraform:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && 'Destroy' || 'Apply' }} ${{ matrix.environment }}
    needs: changes
    if: needs.changes.outputs.environments != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.environments) }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: secure-secrets/${{ matrix.environment }}/terraform.tfstate
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Initialize S3 backend
        run: |
          terraform -chdir="environments/${{ matrix.environment }}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Validate configuration
        run: terraform -chdir="environments/${{ matrix.environment }}" validate

      - name: Create Terraform plan
        run: |
          if [[ "${TF_ACTION}" == "destroy" ]]; then
            terraform -chdir="environments/${{ matrix.environment }}" plan -destroy -input=false -no-color -out=tfplan
          else
            terraform -chdir="environments/${{ matrix.environment }}" plan -input=false -no-color -out=tfplan
          fi

      - name: Apply Terraform plan
        run: terraform -chdir="environments/${{ matrix.environment }}" apply -input=false tfplan
