name: Terraform pull request

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "environments/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.4"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate bootstrap root
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - name: Validate application root
        run: |
          terraform -chdir=environments/dev init -backend=false -input=false
          terraform -chdir=environments/dev validate

      - name: Run repository checks
        run: |
          bash -n scripts/verify-lifecycle.sh scripts/check-no-persistent-secrets.sh
          python3 -m py_compile scripts/verify.py
          ./scripts/check-no-persistent-secrets.sh

  plan:
    name: Plan dev
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_application_name: ${{ vars.APPLICATION_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Initialize S3 backend
        run: |
          terraform -chdir=environments/dev init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Plan dev changes and drift
        id: plan
        run: |
          set +e
          terraform -chdir=environments/dev plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan
          plan_exit_code=$?
          set -e

          if [[ "${plan_exit_code}" -eq 1 ]]; then
            exit 1
          fi

          if [[ "${plan_exit_code}" -eq 2 ]]; then
            echo "Terraform detected proposed changes or infrastructure drift."
          else
            echo "Terraform configuration and remote infrastructure are in sync."
          fi
